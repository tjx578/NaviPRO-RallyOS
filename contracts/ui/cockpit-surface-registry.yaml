schema_version: '1.1.0'
artifact: NAVIPRO_COCKPIT_FIVE_SURFACE_REGISTRY
status: DESIGN_ONLY
source_spec: NAVIPRO-MAPOS-COCKPIT-UNIFIED-V3.0
source_sha256: 74594f143481b953e9fb8b62486069f3244eb83627b650d368e8780e020d1c5a
platform_decision: docs/architecture/ADR-0001-HYBRID-PLATFORMS.md
product: NaviPRO_RallyOS
layout:
  target: HYBRID_TABLET_LANDSCAPE_16_9
  language: id
  main_navigation: HORIZONTAL_SWIPE_THREE_PAGES
  protected_gestures: [MAP_PAN, MAP_ZOOM, MAP_ROTATE, WAYPOINT_DRAG]
  branding: NAVIPRO_RALLYOS_OFFICIAL_WORDMARK
  deprecated_brand_text: Muted Cockpit Style
roles:
  navigator:
    app: apps/navigator-web
    platform: WEB_PWA
    surfaces: [PAGE_1, PAGE_2, PAGE_3]
    navigation: SWIPE
  driver:
    app: android/apps/driver
    platform: ANDROID_NATIVE
    surfaces: [DRIVER_1, DRIVER_2]
    navigation: MODE_TOGGLE
    verified_navipack_required: true
    source_revision_mutation: DENY
surface_order: [PAGE_1, PAGE_2, PAGE_3, DRIVER_1, DRIVER_2]
surfaces:
  PAGE_1:
    title: Data Rally
    owner: apps/navigator-web/features/data-rally
    app: navigator
    role: navigator
    modes: [PREP, REVIEW, CONFIRMED, LIVE]
    input: [ROADBOOK_SOURCE_BYTES, OCR_REVIEW, STARTING_LIST, BRIEFING_EVIDENCE, EVENT_TIMING_RULES]
    output: [CANONICAL_SOURCE_STEPS, SUB_TRAYEK_TIMING_PLAN, START_SCHEDULE, TSD_DELIVERY_ENVELOPE]
    ui:
      - FOTO_SOAL_OCR
      - JAM_START_AND_NO_START_MANUAL_AUTO
      - JADWAL_MULAI_SUB_TRAYEK_WITH_MODE_KET
      - NUMERIC_SPEED_DISTANCE_TIME_TABLE
      - TSD_CADENCER_DELIVERY_ACK
    edits_authority: HUMAN_REVIEWED_SOURCE_AND_START_OVERRIDE
    required_rules:
      - RAW_ROADBOOK_ORDER_IMMUTABLE
      - D_AUTH_SEPARATE_FROM_D_GRAPH
      - SPEED_NUMERIC_NOT_MODE_LABEL
      - START_MANUAL_OVERRIDES_AUTO_UNTIL_REENABLED
      - BRIEFING_HIDDEN_EVIDENCE_ONLY
      - UNVERIFIED_OCR_BLOCKS_TSD_SEND
      - TSD_ACK_NOT_INFERRED_FROM_SEND
    forbidden: [AUTOMATIC_SOURCE_REORDER, TSD_ACK_FABRICATION]
  PAGE_2:
    title: Offline Map & Route Editor
    owner: apps/navigator-web/features/offline-map-editor
    app: navigator
    role: navigator
    modes: [PREP, REVIEW, CONFIRMED, LIVE]
    input: [CANONICAL_SOURCE_STEPS, SUB_TRAYEK_TIMING_PLAN, OSM_OFFLINE_PM_TILES, ORDERED_GRAPH_CANDIDATES, LOCATION_EVIDENCE, AGENT_PROPOSALS]
    output: [DRAFT_ROUTE_REVISION, HUMAN_REVIEW_RECEIPT, CONFIRMED_ROUTE_REVISION, DRIVER_NAVIPACK_DELIVERY]
    ui:
      - ACTIVE_SUB_LIST
      - RAW_ORDERED_ROUTE_STEPS
      - SELECTED_SUB_MAP_ONLY
      - DISTANCE_TIME_SPEED_HEADER
      - ADD_EDIT_DELETE_UNDO_ON_DRAFT
      - MAP_LANDMARK_AND_PHYSICAL_LOCATION_EVIDENCE
      - CONFIRM_ROUTE_GATE
      - SEND_TO_DRIVER_WITH_ACK
    map_layers: [OSM_LOCAL_BASEMAP, OSM_HUMANITARIAN_STYLE_OPTIONAL, VERIFIED_POI, BUILDINGS, OFFICIAL_STEPS, CANDIDATE_ROUTE, SATELLITE_CONTEXT_REVIEW_ONLY]
    required_rules:
      - ORIGINAL_ROADBOOK_TEXT_AND_SEQUENCE_IMMUTABLE
      - ROUTE_EDITS_CREATE_DRAFT_REVISION
      - GRAPH_DISTANCE_NEVER_REPLACES_D_AUTH
      - NO_MANDATORY_OMISSION
      - NO_AUTO_CONFIRM_FROM_MAP_OR_SATELLITE
      - HUMAN_CONFIRM_AND_GATES_BEFORE_DRIVER_SEND
      - ONLY_VERIFIED_PHYSICAL_ANCHORS_FOR_GOOGLE_LINK
    forbidden: [SILENT_DELETE_OFFICIAL_STEP, LIVE_DYNAMIC_REROUTING, THIRD_PARTY_MAP_AS_AUTHORITY]
  PAGE_3:
    title: NaviPRO Rally Agent
    owner: apps/navigator-web/features/rally-agent
    app: navigator
    role: navigator
    modes: [PREP, REVIEW]
    input: [LOCAL_LOCATION_DB, ROUTE_DRAFT_READONLY, EVIDENCE_READONLY, MCP_ALLOWED_PREP_REVIEW_TOOLS, EXTERNAL_LOOKUPS_WHEN_ONLINE]
    output: [PROPOSAL_FOR_PAGE_2, EVIDENCE_REQUEST, GAP_REPORT]
    ui: [AGENT_CHAT, VOICE_TALK_PREP_REVIEW, SOURCE_PROVENANCE, CANDIDATE_COMPARISON, SEND_PROPOSAL_TO_PAGE_2]
    required_rules: [PROPOSE_ONLY, MCP_ALLOWLIST, OFFLINE_LOCAL_SEARCH_GRACEFUL_DEGRADATION, EXPLAIN_SOURCE_AND_UNCERTAINTY]
    forbidden: [DIRECT_ROUTE_MUTATION, VERIFY_LOCATION, CONFIRM_ROUTE, PUBLISH_NAVIPACK, SEND_TO_DRIVER, SEND_TO_TSD, GENERATIVE_LIVE]
  DRIVER_1:
    title: Driver Overview
    owner: android/features/driver-runtime/overview
    app: driver
    role: driver
    modes: [CONFIRMED, LIVE]
    input: [SIGNED_CONFIRMED_NAVIPACK, SELECTED_SUB, LOCKED_CUES, OFFLINE_OSM_MAP, TSD_READONLY_TELEMETRY]
    output: [READONLY_OVERVIEW_PRESENTATION]
    ui: [SELECTED_SUB_FULL_ROUTE, START_FINISH, CUE_LIST, MAJOR_POI, DISTANCE_REMAINING_PROGRESS_TIME, TSD_CONNECTION_STATE]
    camera: NORTH_UP_OR_COURSE_UP_FIT_SUB
    required_rules: [IMMUTABLE_ROUTE_REVISION, NO_NETWORK_REQUIRED_FOR_LIVE, DRIVER_CANNOT_CONFIRM]
    forbidden: [EDIT_ROUTE, AGENT, SEND_LINK, SEND_TO_DRIVER, CONFIRM_ROUTE, ONLINE_REROUTE]
  DRIVER_2:
    title: Driver Driving Mode
    owner: android/features/driver-runtime/driving
    app: driver
    role: driver
    modes: [CONFIRMED, LIVE]
    input: [SIGNED_CONFIRMED_NAVIPACK, LOCKED_CUES, GNSS_AND_ODOMETER, MONOTONIC_CLOCK, TSD_READONLY_TELEMETRY]
    output: [READONLY_DRIVING_PRESENTATION, RUNTIME_EVENT_LOG]
    ui: [COURSE_UP_MAP, VEHICLE_LOWER_THIRD, LOOKAHEAD_CORRIDOR, NEXT_TURN, ACTIVE_CUE, NEXT_CUES, OSM_BUILDINGS_AT_HIGH_ZOOM, TSD_STATUS, OFF_ROUTE_WARNING]
    camera: COURSE_UP_LOWER_THIRD_LOOKAHEAD
    required_rules:
      - CUE_FSM_OFFSET_HEADING_CONFIDENCE_MONOTONIC
      - OFF_ROUTE_FREEZE_NO_AUTO_REROUTE
      - DEVICE_PACK_HASH_VALIDATED
      - NEVER_DROP_ACTIVE_ROUTE_CUE_OR_OFF_ROUTE_WARNING
    forbidden: [EDIT_ROUTE, AGENT, SEND_LINK, SEND_TO_DRIVER, CONFIRM_ROUTE, CLOUD_DEPENDENT_LIVE_ROUTING]
shared_authority:
  official_roadbook: PAGE_1_SOURCE
  canonical_route_revision: NAVIGATOR_PAGE_2_HUMAN_GATE
  automated_assistant: PAGE_3_PROPOSE_ONLY
  runtime: DRIVER_1_AND_DRIVER_2_READ_ONLY
  distance_domains: [D_auth, D_graph, D_odo, D_geo]
  route_reasoning_constraints: [ORDERED_INSTRUCTIONS, OFFICIAL_DISTANCE_KM_PAL, EVENT_TIME_RULES, DIRECTED_TOPOLOGY, PHYSICAL_EVIDENCE]
  driver_artifact: SIGNED_NAVIPACK_AFTER_BLOCKING_GATES
  mcp_access: AGENT_READ_PLAN_PROPOSE_ONLY
  no_network_dependencies_in_live: true
integration_boundaries:
  tsd_cadencer:
    system: EXTERNAL_INDEPENDENT_APP
    sender: PAGE_1_NAVIGATOR
    adapter: services/integrations/tsd-cadencer
    device_adapter: android/integrations/tsd-cadencer
    contract_status: NOT_IMPLEMENTED
    delivery: IDEMPOTENT_ENVELOPE_PLUS_ACK
    driver_consumer: READONLY_CONNECTION_AND_TELEMETRY
  driver_navipack:
    sender: PAGE_2_NAVIGATOR_AFTER_CONFIRMATION
    adapter: services/integrations/device-transfer
    device_adapter: android/integrations/device-transfer
    contract_status: NOT_IMPLEMENTED
    delivery: REVISION_HASH_PLUS_ACK
  osm_routing:
    consumer: PAGE_2_REVIEW
    type: GRAPH_CANDIDATE_NON_AUTHORITATIVE
    offline_graph_build: NOT_IMPLEMENTED
  agent_mcp:
    consumer: PAGE_3_PREP_REVIEW
    server_status: NOT_IMPLEMENTED
  offline_map:
    renderer_targets:
      navigator: MAPLIBRE_GL_JS
      driver: MAPLIBRE_NATIVE
    assets: [PMTILES, LOCAL_STYLE_JSON, LOCAL_GLYPHS, LOCAL_SPRITES, LOCAL_FONTS, LOCATION_SQLITE_RTREE]
    asset_runtime_status: NOT_BUILT
