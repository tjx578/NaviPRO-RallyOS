registry_id: NAVIPRO-SPATIAL-CAPABILITY-REGISTRY-V1
version: 1.0.0-draft
status: REA_BASELINE_NOT_RACE_READY
source_manifest: ../../docs/rea/KEPLER-GL-SOURCE-MANIFEST.yaml
principles:
- Parity is targeted for PREP/REVIEW spatial intelligence, not for authority mutation.
- Confirmed roadbook order and confirmed route revisions remain immutable.
- Map analytics, layer auto-detection, SQL, provider data and visual effects are evidence/support tools only.
- Driver LIVE remains offline, deterministic and free of dynamic Kepler/agent/network dependencies.
- Large data uses tile/Arrow/Parquet patterns; authoritative route geometry stays canonical and versioned.
