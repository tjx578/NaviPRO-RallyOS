          application/json:
            schema:
              $ref: '#/components/schemas/SurveyAssessmentRequest'
      parameters:
      - in: path
        name: observationId
        required: true
        schema: *id006
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type:
          - object
          - 'null'
          additionalProperties: true
        trace_id:
          type:
          - string
          - 'null'
    IdRef:
      type: string
      minLength: 1
      maxLength: 128
    Sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    GeoPointE7:
      type: object
      required:
      - lat_e7
      - lon_e7
      additionalProperties: false
      properties:
        lat_e7:
          type: integer
          minimum: -900000000
          maximum: 900000000
        lon_e7:
          type: integer
          minimum: -1800000000
          maximum: 1800000000
    LocationRef:
      type: object
      required:
      - location_id
      additionalProperties: false
      properties:
        location_id:
          $ref: '#/components/schemas/IdRef'
        name:
          type:
          - string
          - 'null'
        coord:
          oneOf:
          - $ref: '#/components/schemas/GeoPointE7'
          - type: 'null'
        status:
          type: string
          enum:
          - UNRESOLVED
          - CANDIDATE
          - CONFLICTED
          - VERIFIED
          - REJECTED_CONTEXT_ONLY
          - RETIRED
    SourceBinding:
      type: object
      required:
      - source_id
      - revision_id
      - sha256
      additionalProperties: false
      properties:
        source_id:
          $ref: '#/components/schemas/IdRef'
        revision_id:
          $ref: '#/components/schemas/IdRef'
        sha256:
          $ref: '#/components/schemas/Sha256'
        source_anchor:
          type:
          - string
          - 'null'
    Rational:
      type: object
      required:
      - numerator
      - denominator
      additionalProperties: false
      properties:
        numerator:
          type: integer
        denominator:
          type: integer
          minimum: 1
    TimingRule:
      type: object
      required:
      - rule_id
      - mode
      - clock_scale
      - rounding_rule
      additionalProperties: false
      properties:
        rule_id:
          $ref: '#/components/schemas/IdRef'
        mode:
          type: string
          enum:
          - TETAP_DETIK
          - TETAP_MENIT
          - RATA_RATA
          - BEBAS
          - EVENT_DEFINED
        clock_scale:
          $ref: '#/components/schemas/Rational'
        rounding_rule:
          type: string
        authority_profile_id:
          $ref: '#/components/schemas/IdRef'
    RoadbookEvent:
      type: object
      required:
      - event_id
      - sub_trayek_id
      - source_sequence
      - event_type
      - raw_text
      - mandatory
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/IdRef'
        sub_trayek_id:
          $ref: '#/components/schemas/IdRef'
        source_sequence:
          type: integer
          minimum: 1
        sub_sequence:
          type: integer
          minimum: 0
          default: 0
        event_type:
          type: string
          enum:
          - RALLY_INSTRUCTION
          - PHYSICAL_LANDMARK
          - ROAD_CONTEXT
          - DISTANCE_MARKER
          - CONTROL_POINT
          - TIME_RULE
        raw_text:
          type: string
        mandatory:
          type: boolean
        location_ref:
          oneOf:
          - $ref: '#/components/schemas/LocationRef'
          - type: 'null'
    SubTrayek:
      type: object
      required:
      - sub_trayek_id
      - event_id
      - sequence
      - authority_distance_mm
      - authority_duration_ms
      - timing_mode
      - validation_status
      additionalProperties: false
      properties:
        sub_trayek_id:
          $ref: '#/components/schemas/IdRef'
        event_id:
          $ref: '#/components/schemas/IdRef'
        sequence:
          type: integer
          minimum: 1
        name:
          type:
          - string
          - 'null'
        authority_distance_mm:
          type: integer
          minimum: 0
        authority_duration_ms:
          type: integer
          minimum: 0
        timing_mode:
          type: string
          enum:
          - TETAP_DETIK
          - TETAP_MENIT
          - RATA_RATA
          - BEBAS
          - EVENT_DEFINED
        start_location:
          oneOf:
          - $ref: '#/components/schemas/LocationRef'
          - type: 'null'
        finish_location:
          oneOf:
          - $ref: '#/components/schemas/LocationRef'
          - type: 'null'
        roadbook_event_ids:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'
        active_route_revision_id:
          type:
          - string
          - 'null'
        timing_plan_id:
          type:
          - string
          - 'null'
        validation_status:
          type: string
          enum:
          - NOT_RUN
          - HOLD
          - PASS
          - FAIL
    Event:
      type: object
      required:
      - event_id
      - name
      - status
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/IdRef'
        name:
          type: string
        date:
          type:
          - string
          - 'null'
          format: date
        status:
          type: string
          enum:
          - DRAFT
          - PREP
          - REVIEW
          - LOCKED
          - COMPLETED
          - RETIRED
        authority_profile_id:
          type:
          - string
          - 'null'
        source_bindings:
          type: array
          items:
            $ref: '#/components/schemas/SourceBinding'
    LocationCandidate:
      type: object
      required:
      - candidate_id
      - query
      - source
      - status
      additionalProperties: false
      properties:
        candidate_id:
          $ref: '#/components/schemas/IdRef'
        query:
          type: string
        name:
          type:
          - string
          - 'null'
        coord:
          oneOf:
          - $ref: '#/components/schemas/GeoPointE7'
          - type: 'null'
        source:
          type: string
          enum:
          - NAVIPRO_DB
          - OSM
          - GOOGLE
          - WIKIMAPIA
          - MANUAL
          - AI_INFERENCE
          - OTHER
        status:
          type: string
          enum:
          - CANDIDATE
          - CONFLICTED
          - REJECTED_CONTEXT_ONLY
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'
    KmPalParseRequest:
      type: object
      required:
      - raw_marker_text
      additionalProperties: false
      properties:
        raw_marker_text:
          type: string
        grammar_version:
          type:
          - string
          - 'null'
    KmPalParseResult:
      type: object
      required:
      - raw_marker_text
      - parse_status
      additionalProperties: false
      properties:
        raw_marker_text:
          type: string
        parse_status:
          type: string
          enum:
          - PARSED
          - AMBIGUOUS
          - CONFLICTED
          - UNRESOLVED
        destination_code:
          type:
          - string
          - 'null'
        destination_distance_mm:
          type:
          - integer
          - 'null'
          minimum: 0
        origin_code:
          type:
          - string
          - 'null'
        origin_distance_mm:
          type:
          - integer
          - 'null'
          minimum: 0
        reference_code:
          type:
          - string
          - 'null'
        ambiguity_codes:
          type: array
          items:
            type: string
    KmPalEstimateRequest:
      type: object
      required:
      - parse
      - event_context_id
      additionalProperties: false
      properties:
        parse:
          $ref: '#/components/schemas/KmPalParseResult'
        event_context_id:
          $ref: '#/components/schemas/IdRef'
        route_profile_id:
          type:
          - string
          - 'null'
        providers:
          type: array
          items:
            type: string
            enum:
            - NAVIPRO_DB
            - OFFLINE_GRAPH
            - OSM
            - GOOGLE
            - WIKIMAPIA
    KmPalAssessment:
      type: object
      required:
      - assessment_status
      - candidate_id
      - corridor_fit
      additionalProperties: false
      properties:
        assessment_status:
          type: string
          enum:
          - PASS_CANDIDATE
          - HOLD
          - REJECT_CANDIDATE
        candidate_id:
          $ref: '#/components/schemas/IdRef'
        corridor_fit:
          type: boolean
        measured_from_origin_mm:
          type:
          - integer
          - 'null'
          minimum: 0
        measured_to_destination_mm:
          type:
          - integer
          - 'null'
          minimum: 0
        origin_residual_mm:
          type:
          - integer
          - 'null'
        destination_residual_mm:
          type:
          - integer
          - 'null'
        graph_release_id:
          type:
          - string
          - 'null'
        notes:
          type: array
          items:
            type: string
    LocationObservation:
      type: object
      required:
      - observation_id
      - candidate_id
      - source
      - proposal_only
      additionalProperties: false
      properties:
        observation_id:
          $ref: '#/components/schemas/IdRef'
        candidate_id:
          $ref: '#/components/schemas/IdRef'
        source:
          type: string
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        evidence_sha256:
          oneOf:
          - $ref: '#/components/schemas/Sha256'
          - type: 'null'
        proposal_only:
          type: boolean
          const: true
        details:
          type: object
          additionalProperties: true
    LocationDecision:
      type: object
      required:
      - decision_id
      - candidate_id
      - decision
      - reviewer_principal_id
      - reason_code
      additionalProperties: false
      properties:
        decision_id:
          $ref: '#/components/schemas/IdRef'
        candidate_id:
          $ref: '#/components/schemas/IdRef'
        decision:
          type: string
          enum:
          - VERIFY
          - REJECT
          - CONFLICT
          - RETIRE
        reviewer_principal_id:
          $ref: '#/components/schemas/IdRef'
        reason_code:
          type: string
        decided_at:
          type: string
          format: date-time
    RoutePoint:
      type: object
      required:
      - seq
      - lat_e7
      - lon_e7
      - offset_mm
      - edge_id
      additionalProperties: false
      properties:
        seq:
          type: integer
          minimum: 1
        lat_e7:
          type: integer
          minimum: -900000000
          maximum: 900000000
        lon_e7:
          type: integer
          minimum: -1800000000
          maximum: 1800000000
        offset_mm:
          type: integer
          minimum: 0
        edge_id:
          $ref: '#/components/schemas/IdRef'
    CoverageBinding:
      type: object
      required:
      - event_id
      - binding_type
      - route_element_refs
      - disposition
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/IdRef'
        binding_type:
          type: string
          enum:
          - MANEUVER_TRANSITION
          - LANDMARK_POINT
          - DISTANCE_MARKER_POINT
          - CONTROL_POINT
          - ROAD_CONTEXT
        route_element_refs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IdRef'
        route_offset_mm:
          type:
          - integer
          - 'null'
          minimum: 0
        disposition:
          type: string
          enum:
          - MAPPED
          - NOT_APPLICABLE_WITH_REASON
          - UNMAPPED
          - CONFLICTED
        reason:
          type:
          - string
          - 'null'
    RouteRevision:
      type: object
      required:
      - route_id
      - revision_id
      - sub_trayek_id
      - status
      - profile
      - providers
      - graph_distance_mm
      - route_points
      - coverage_bindings
      additionalProperties: false
      properties:
        route_id:
          $ref: '#/components/schemas/IdRef'
        revision_id:
          $ref: '#/components/schemas/IdRef'
        parent_revision_id:
          type:
          - string
          - 'null'
        sub_trayek_id:
          $ref: '#/components/schemas/IdRef'
        status:
          type: string
          enum:
          - DRAFT
          - CANDIDATE
          - VALIDATED
          - CONFIRMED
          - ACTIVE
          - COMPLETED
          - RETIRED
        profile:
          type: string
          enum:
          - RALLY_OFFICIAL
          - RALLY_MASTERPOS
          - RALLY_CANDIDATE
          - GOOGLE_REFERENCE
          - OSM_REFERENCE
          - OFFLINE_GRAPH
          - DRIVER_ACTIVE
          - RECORDED
        providers:
          type: array
          items:
            type: string
            enum:
            - OFFLINE_GRAPH
            - NAVIPRO_DB
            - GOOGLE_REFERENCE
            - OSM_REFERENCE
            - MANUAL
            - MASTERPOS
        authority_distance_mm:
          type:
          - integer
          - 'null'
          minimum: 0
        graph_distance_mm:
          type: integer
          minimum: 0
        route_points:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/RoutePoint'
        coverage_bindings:
          type: array
          items:
            $ref: '#/components/schemas/CoverageBinding'
    RouteResolveRequest:
      type: object
      required:
      - sub_trayek_id
      - profile
      - constraints
      additionalProperties: false
      properties:
        sub_trayek_id:
          $ref: '#/components/schemas/IdRef'
        profile:
          type: string
          enum:
          - RALLY_OFFICIAL
          - RALLY_MASTERPOS
          - RALLY_CANDIDATE
          - GOOGLE_REFERENCE
          - OSM_REFERENCE
          - OFFLINE_GRAPH
        providers:
          type: array
          items:
            type: string
            enum:
            - OFFLINE_GRAPH
            - NAVIPRO_DB
            - GOOGLE_REFERENCE
            - OSM_REFERENCE
            - MANUAL
            - MASTERPOS
        constraints:
          type: object
          required:
          - preserve_source_order
          - mandatory_landmarks
          additionalProperties: false
          properties:
            preserve_source_order:
              type: boolean
              const: true
            mandatory_landmarks:
              type: boolean
              const: true
            no_tsp_reorder:
              type: boolean
              const: true
    TimingComputeRequest:
      type: object
      required:
      - distance_mm
      - speed_kmh_ratio
      - start_time
      - timing_rule
      additionalProperties: false
      properties:
        distance_mm:
          type: integer
          minimum: 0
        speed_kmh_ratio:
          $ref: '#/components/schemas/Rational'
        start_time:
          type: string
          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{3})?$
        timing_rule:
          $ref: '#/components/schemas/TimingRule'
    TimingComputeResult:
      type: object
      required:
      - travel_duration_ms
      - arrival_time
      - calculation_receipt
      additionalProperties: false
      properties:
        travel_duration_ms:
          type: integer
          minimum: 0
        arrival_time:
          type: string
        calculation_receipt:
          type: object
          required:
          - distance_mm
          - speed_kmh_ratio
          - clock_scale
          additionalProperties: false
          properties:
            distance_mm:
              type: integer
            speed_kmh_ratio:
              $ref: '#/components/schemas/Rational'
            clock_scale:
              $ref: '#/components/schemas/Rational'
            rounding_rule:
              type: string
    TimingPlan:
      type: object
      required:
      - timing_plan_id
      - sub_trayek_id
      - start_time
      - duration_ms
      - status
      additionalProperties: false
      properties:
        timing_plan_id:
          $ref: '#/components/schemas/IdRef'
        sub_trayek_id:
          $ref: '#/components/schemas/IdRef'
        start_time:
          type: string
        duration_ms:
          type: integer
          minimum: 0
        arrival_time:
          type: string
        rule_id:
          $ref: '#/components/schemas/IdRef'
        status:
          type: string
          enum:
          - DRAFT
          - VALIDATED
          - CONFIRMED
    GateResult:
      type: object
      required:
      - gate
      - result
      additionalProperties: false
      properties:
        gate:
          type: string
          enum:
          - SCHEMA_DOMAIN
          - SOURCE_INTEGRITY
          - RELEASE_BINDING
          - REVIEW_AUTHORIZATION
          - SOURCE_ORDER
          - SOURCE_COVERAGE
          - MANDATORY_LANDMARK
          - SPATIAL_VERIFICATION
          - ROUTE_CONTINUITY
          - LANDMARK_ROUTE_BINDING
          - DENSE_GEOMETRY_MEASURE
          - MONOTONIC_SEQUENCE
          - DISTANCE_RESIDUAL_PER_SUB
          - INTER_SUB_CHAINING
          - ROUTE_ENDPOINT_BINDING
          - TIMING_CONSISTENCY
        result:
          type: string
          enum:
          - PASS
          - FAIL
          - NOT_RUN
        message:
          type:
          - string
          - 'null'
    ValidationReport:
      type: object
      required:
      - report_id
      - subject_id
      - release_status
      - gates
      additionalProperties: false
      properties:
        report_id:
          $ref: '#/components/schemas/IdRef'
        subject_id:
          $ref: '#/components/schemas/IdRef'
        release_status:
          type: string
          enum:
          - PASS
          - HOLD
        gates:
          type: array
          minItems: 16
          maxItems: 16
          items:
            $ref: '#/components/schemas/GateResult'
    MapsLinkRequest:
      type: object
      required:
      - route_revision_id
      - verified_anchor_ids
      additionalProperties: false
      properties:
        route_revision_id:
          $ref: '#/components/schemas/IdRef'
        verified_anchor_ids:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/IdRef'
        segment_limit:
          type: integer
          minimum: 2
          maximum: 25
          default: 25
    MapsLinkPreview:
      type: object
      required:
      - route_revision_id
      - segments
      - reference_only
      additionalProperties: false
      properties:
        route_revision_id:
          $ref: '#/components/schemas/IdRef'
        segments:
          type: array
          items:
            type: string
        reference_only:
          type: boolean
          const: true
    DeliveryEnvelope:
      type: object
      required:
      - delivery_id
      - target
      - schema_version
      - revision_id
      - payload_sha256
      - idempotency_key
      - state
      additionalProperties: false
      properties:
        delivery_id:
          $ref: '#/components/schemas/IdRef'
        target:
          type: string
          enum:
          - TSD_CADENCER
          - DRIVER_RUNTIME
        schema_version:
          type: string
        revision_id:
          $ref: '#/components/schemas/IdRef'
        payload_sha256:
          $ref: '#/components/schemas/Sha256'
        idempotency_key:
          type: string
        state:
          type: string
          enum:
          - QUEUED
          - SENT
          - ACKED
          - FAILED
        ack_at:
          type:
          - string
          - 'null'
          format: date-time
    WorkflowReviewRequest:
      type: object
      required:
      - event_id
      - sub_trayek_id
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/IdRef'
        sub_trayek_id:
          $ref: '#/components/schemas/IdRef'
        include_location_search:
          type: boolean
          default: true
        include_maps_preview:
          type: boolean
          default: true
