openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: NaviPRO RallyOS Unified API
  version: 0.4.0-vnext-streetcomplete-rea
  description: Unified PREP/REVIEW contract consolidating legacy NaviPRO APIs into canonical RallyOS domains. Driver
    LIVE runtime consumes confirmed offline packages and does not depend on this API. Spatial Intelligence REA baseline
    adds Kepler-grade PREP/REVIEW mapping capabilities without granting route authority. CesiumJS capability REA defines
    PREP/REVIEW-only 3D scene and terrain analytical plan contracts; definitions are not deployed API implementations.
    StreetComplete REA adds clean-room, PREP/REVIEW-only field-survey contracts; observational data is not OSM-tag editing,
    verified road truth, or route authority.
servers:
- url: https://api.navipro.local/vnext
  description: Placeholder target; replace per deployment
security:
- bearerAuth: []
tags:
- name: System
- name: Rally
- name: Location
- name: Evidence
- name: Route
- name: Spatial
- name: Timing
- name: Validation
- name: Integration
- name: Workflow
- name: Release
- name: Governance
- name: Terrain3D
  description: Non-authoritative 3D geospatial analysis planning and inspection
- name: FieldSurvey
  description: Quest-inspired offline survey planning and staging (no direct OSM publish)
