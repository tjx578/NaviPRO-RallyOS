        '401':
          description: Authentication required
        '403':
          description: Forbidden
        '409':
          description: Stale source/conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveySyncPlanRequest'
  /survey/overlays/plan:
    post:
      operationId: planSurveyOverlays
      summary: Plan thematic road-attribute review overlays
      tags:
      - FieldSurvey
      x-navipro-mcp:
        enabled: true
        tool: navipro.survey.overlays.plan
      x-navipro-mode:
      - PREP
      - REVIEW
      x-navipro-authority: AGENT_PROPOSE
      x-navipro-side-effect: NONE
      responses:
        '200':
          description: PREP/REVIEW assessment or proposal only; not authoritative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyOverlayPlanResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
        '403':
          description: Forbidden
        '409':
          description: Stale source/conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyOverlayPlanRequest'
  /survey/decisions/{observationId}:
    post:
      operationId: decideSurveyEvidence
      summary: Navigator alone issues a scoped evidence decision
      tags:
      - FieldSurvey
      x-navipro-mcp:
        enabled: false
      x-navipro-mode:
      - PREP
      - REVIEW
      x-navipro-authority: NAVIGATOR_ONLY
      x-navipro-side-effect: AUTHORITY_MUTATION
      responses:
        '200':
          description: PREP/REVIEW assessment or proposal only; not authoritative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyTaskResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
        '403':
          description: Forbidden
        '409':
          description: Stale source/conflict
      requestBody:
