openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: NaviPRO RallyOS Unified API
  version: 0.1.0-vnext
  description: Unified PREP/REVIEW contract consolidating legacy NaviPRO APIs into canonical RallyOS domains. Driver
    LIVE runtime consumes confirmed offline packages and does not depend on this API.
servers:
- url: https://api.navipro.local/vnext
  description: Placeholder target; replace per deployment
security:
- bearerAuth: []
tags:
- name: System
- name: Rally
- name: Location
- name: Evidence
- name: Route
- name: Timing
- name: Validation
- name: Integration
- name: Workflow
- name: Release
- name: Governance
