components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type:
          - object
          - 'null'
          additionalProperties: true
        trace_id:
          type:
          - string
          - 'null'
    IdRef:
      type: string
      minLength: 1
      maxLength: 128
    Sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    GeoPointE7:
      type: object
      required:
      - lat_e7
      - lon_e7
      additionalProperties: false
      properties:
        lat_e7:
          type: integer
          minimum: -900000000
          maximum: 900000000
        lon_e7:
          type: integer
          minimum: -1800000000
          maximum: 1800000000
    LocationRef:
      type: object
      required:
      - location_id
      additionalProperties: false
      properties:
        location_id:
          $ref: '#/components/schemas/IdRef'
        name:
          type:
          - string
          - 'null'
        coord:
          oneOf:
          - $ref: '#/components/schemas/GeoPointE7'
          - type: 'null'
        status:
          type: string
          enum:
          - UNRESOLVED
          - CANDIDATE
          - CONFLICTED
          - VERIFIED
          - REJECTED_CONTEXT_ONLY
          - RETIRED
    SourceBinding:
      type: object
      required:
      - source_id
      - revision_id
      - sha256
      additionalProperties: false
      properties:
        source_id:
          $ref: '#/components/schemas/IdRef'
        revision_id:
          $ref: '#/components/schemas/IdRef'
        sha256:
          $ref: '#/components/schemas/Sha256'
        source_anchor:
          type:
          - string
          - 'null'
    Rational:
      type: object
      required:
      - numerator
      - denominator
      additionalProperties: false
      properties:
        numerator:
          type: integer
        denominator:
          type: integer
          minimum: 1
    TimingRule:
      type: object
      required:
      - rule_id
      - mode
      - clock_scale
      - rounding_rule
      additionalProperties: false
      properties:
        rule_id:
          $ref: '#/components/schemas/IdRef'
        mode:
          type: string
          enum:
          - TETAP_DETIK
          - TETAP_MENIT
          - RATA_RATA
          - BEBAS
          - EVENT_DEFINED
        clock_scale:
          $ref: '#/components/schemas/Rational'
        rounding_rule:
          type: string
        authority_profile_id:
          $ref: '#/components/schemas/IdRef'
    RoadbookEvent:
      type: object
      required:
      - event_id
      - sub_trayek_id
      - source_sequence
      - event_type
      - raw_text
      - mandatory
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/IdRef'
        sub_trayek_id:
          $ref: '#/components/schemas/IdRef'
        source_sequence:
          type: integer
          minimum: 1
        sub_sequence:
          type: integer
          minimum: 0
          default: 0
        event_type:
          type: string
          enum:
          - RALLY_INSTRUCTION
          - PHYSICAL_LANDMARK
          - ROAD_CONTEXT
          - DISTANCE_MARKER
          - CONTROL_POINT
          - TIME_RULE
        raw_text:
          type: string
        mandatory:
          type: boolean
        location_ref:
          oneOf:
          - $ref: '#/components/schemas/LocationRef'
          - type: 'null'
    SubTrayek:
      type: object
      required:
      - sub_trayek_id
      - event_id
      - sequence
      - authority_distance_mm
      - authority_duration_ms
      - timing_mode
      - validation_status
      additionalProperties: false
      properties:
        sub_trayek_id:
          $ref: '#/components/schemas/IdRef'
        event_id:
          $ref: '#/components/schemas/IdRef'
        sequence:
          type: integer
          minimum: 1
        name:
          type:
          - string
          - 'null'
        authority_distance_mm:
          type: integer
          minimum: 0
        authority_duration_ms:
          type: integer
          minimum: 0
        timing_mode:
          type: string
          enum:
          - TETAP_DETIK
          - TETAP_MENIT
          - RATA_RATA
          - BEBAS
          - EVENT_DEFINED
        start_location:
          oneOf:
          - $ref: '#/components/schemas/LocationRef'
          - type: 'null'
        finish_location:
          oneOf:
          - $ref: '#/components/schemas/LocationRef'
          - type: 'null'
        roadbook_event_ids:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'
        active_route_revision_id:
          type:
          - string
          - 'null'
        timing_plan_id:
          type:
          - string
          - 'null'
        validation_status:
          type: string
          enum:
          - NOT_RUN
          - HOLD
          - PASS
          - FAIL
    Event:
      type: object
      required:
      - event_id
      - name
      - status
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/IdRef'
        name:
          type: string
        date:
          type:
          - string
          - 'null'
          format: date
        status:
          type: string
          enum:
          - DRAFT
          - PREP
          - REVIEW
          - LOCKED
          - COMPLETED
          - RETIRED
        authority_profile_id:
          type:
          - string
          - 'null'
        source_bindings:
          type: array
          items:
            $ref: '#/components/schemas/SourceBinding'
    LocationCandidate:
      type: object
      required:
      - candidate_id
      - query
      - source
      - status
      additionalProperties: false
      properties:
        candidate_id:
          $ref: '#/components/schemas/IdRef'
        query:
          type: string
        name:
          type:
          - string
          - 'null'
        coord:
          oneOf:
          - $ref: '#/components/schemas/GeoPointE7'
          - type: 'null'
        source:
          type: string
          enum:
          - NAVIPRO_DB
          - OSM
          - GOOGLE
          - WIKIMAPIA
          - MANUAL
          - AI_INFERENCE
          - OTHER
        status:
          type: string
          enum:
          - CANDIDATE
          - CONFLICTED
          - REJECTED_CONTEXT_ONLY
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'
    KmPalParseRequest:
      type: object
      required:
      - raw_marker_text
      additionalProperties: false
      properties:
        raw_marker_text:
          type: string
