      operationId: healthCheck
      summary: Health check
      tags:
      - System
      x-navipro-mcp:
        enabled: false
      x-navipro-mode:
      - PREP
      - REVIEW
      - LIVE
      x-navipro-authority: SYSTEM
      x-navipro-side-effect: NONE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid input
          content:
