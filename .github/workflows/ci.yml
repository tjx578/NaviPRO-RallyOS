name: NaviPRO CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navipro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts-python-${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r requirements-test.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python tools/validate_openapi.py
      - run: python tools/validate_spatial_rea.py
      - run: python tools/validate_cesium_rea.py
      - run: python tools/build_mcp_registry.py --check
      - run: python tools/validate_prompt_pack.py
  javascript:
    name: routing-review-javascript
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test apps/routing-lab-web/test/*.test.mjs
