name: Agent 4 Blind PREP Contract
on:
  push:
    branches: [feat/agent4-agent7-trayek1-cue-reconciliation-v1]
  pull_request:
    paths:
      - "python/src/navipro_rallyos/route/**"
      - "tests/contracts/test_agent4_*"
      - "tests/contracts/test_pre_event_route_workflow.py"
      - ".github/workflows/agent4-blind-prep.yml"
jobs:
  pre-event-no-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify blind routing and retrospective isolation
        run: python -m pytest -q tests/contracts/test_pre_event_route_workflow.py tests/contracts/test_agent4_master_anchor_reconcile.py tests/contracts/test_agent4_agent7_cue_review.py
